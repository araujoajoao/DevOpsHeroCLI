[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devopsherocli"
version = "1.0.0"
description = "DevOpsHeroCLI: Simulador de terminal interativo para aprender Linux, Docker, Kubernetes e Datadog digitando comandos reais."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "João Araújo", email = "araujoaojoao@gmail.com" }
]
keywords = [
    "devops",
    "linux",
    "sysadmin",
    "docker",
    "kubernetes",
    "datadog",
    "cli",
    "tui",
    "simulator",
    "education",
    "gamification",
    "terminal"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=0.70.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/araujoajoao/DevOpsHeroCLI"
Repository = "https://github.com/araujoajoao/DevOpsHeroCLI"
Issues = "https://github.com/araujoajoao/DevOpsHeroCLI/issues"

[project.scripts]
devopsherocli = "devopsherocli.cli:main"
devopshero = "devopsherocli.cli:main"

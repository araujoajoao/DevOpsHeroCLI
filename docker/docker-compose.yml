services:
  devopshero:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devopsherocli:latest
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
    volumes:
      - devopshero-progress:/home/devops/.devopsherocli

volumes:
  devopshero-progress:
    name: devopshero-progress

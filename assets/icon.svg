<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Bezel Gradient (Brushed Dark Titanium) -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55585d"/>
      <stop offset="25%" stop-color="#2d3034"/>
      <stop offset="50%" stop-color="#181a1d"/>
      <stop offset="75%" stop-color="#2d3034"/>
      <stop offset="100%" stop-color="#404348"/>
    </linearGradient>

    <!-- Outer Rim Metallic Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e9297"/>
      <stop offset="50%" stop-color="#2a2c30"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow Filter for Icon Squircle -->
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Squircle with Realistic Drop Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bezelGrad)" stroke="url(#rimStroke)" stroke-width="4" filter="url(#iconShadow)"/>

  <!-- Inner Bezel Ring -->
  <rect x="44" y="44" width="424" height="424" rx="92" ry="92" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Screen Surface -->
  <rect x="52" y="52" width="408" height="408" rx="84" ry="84" fill="url(#screenGrad)"/>

  <!-- Top Title Bar Divider -->
  <line x1="52" y1="120" x2="460" y2="120" stroke="#21262d" stroke-width="2"/>

  <!-- macOS Window Traffic Light Controls -->
  <!-- Red Close -->
  <circle cx="92" cy="88" r="10" fill="#ff5f56" stroke="#e0443e" stroke-width="1.5"/>
  <circle cx="89" cy="85" r="3" fill="#ffffff" opacity="0.4"/>
  <!-- Yellow Minimize -->
  <circle cx="124" cy="88" r="10" fill="#ffbd2e" stroke="#dea123" stroke-width="1.5"/>
  <circle cx="121" cy="85" r="3" fill="#ffffff" opacity="0.4"/>
  <!-- Green Expand -->
  <circle cx="156" cy="88" r="10" fill="#27c93f" stroke="#1aab29" stroke-width="1.5"/>
  <circle cx="153" cy="85" r="3" fill="#ffffff" opacity="0.4"/>

  <!-- Window Header Tab -->
  <rect x="190" y="70" width="160" height="34" rx="8" ry="8" fill="#1f242c" stroke="#30363d" stroke-width="1"/>
  <text x="270" y="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">zsh · devops</text>

  <!-- Terminal Display Content -->
  <g filter="url(#neonGlow)">
    <!-- Oh My Zsh Arrow -->
    <path d="M 90 270 L 108 280 L 90 290 Z" fill="#30d158"/>
    <!-- Terminal Text 'devopsherocli' -->
    <text x="126" y="287" font-family="'JetBrains Mono', 'Fira Code', 'Menlo', monospace" font-size="34" font-weight="700" letter-spacing="-0.5">
      <tspan fill="#00f2fe">devops</tspan><tspan fill="#30d158">hero</tspan><tspan fill="#ffffff">cli</tspan>
    </text>
    <!-- Block Cursor -->
    <rect x="396" y="258" width="18" height="34" rx="2" ry="2" fill="#00f2fe" opacity="0.9"/>
  </g>

  <!-- Secondary subtle command prompt hint line -->
  <text x="126" y="335" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="16" fill="#484f58">
    <tspan fill="#8b949e">~</tspan> git:(<tspan fill="#ff7b72">main</tspan>)
  </text>

  <!-- Diagonal Glass Specular Highlight -->
  <path d="M 52 140 L 460 300 L 460 52 L 140 52 Z" fill="url(#glassReflect)" clip-path="url(#screenClip)"/>

  <!-- Clip path for screen -->
  <clipPath id="screenClip">
    <rect x="52" y="52" width="408" height="408" rx="84" ry="84"/>
  </clipPath>
</svg>

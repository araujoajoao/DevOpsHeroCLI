<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Outer Apple HIG Squircle Mask (824x824 at (100,100), rx=185.4) -->
    <clipPath id="appleSquircle">
      <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"/>
    </clipPath>

    <!-- Brushed Silver Aluminium Bezel Gradient -->
    <linearGradient id="silverBezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaedf2"/>
      <stop offset="6%" stop-color="#d8dce4"/>
      <stop offset="45%" stop-color="#b4b9c2"/>
      <stop offset="85%" stop-color="#9399a3"/>
      <stop offset="100%" stop-color="#7c818c"/>
    </linearGradient>

    <!-- Outer Bezel Precision Highlight Stroke -->
    <linearGradient id="bezelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Inner Recessed Groove Gradient -->
    <linearGradient id="grooveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040506"/>
      <stop offset="40%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>

    <!-- Matte Terminal Screen Deep Surface Gradient -->
    <linearGradient id="screenSurfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282a2f"/>
      <stop offset="30%" stop-color="#202226"/>
      <stop offset="80%" stop-color="#17181c"/>
      <stop offset="100%" stop-color="#131417"/>
    </linearGradient>

    <!-- Screen Glass Rim Inner Highlight -->
    <linearGradient id="screenRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Subtle Diagonal Specular Reflection across Screen -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- 0. Subtle Apple Drop Shadow underneath Bezel -->
  <rect x="100" y="116" width="824" height="824" rx="185.4" ry="185.4" fill="#000000" opacity="0.08"/>
  <rect x="100" y="110" width="824" height="824" rx="185.4" ry="185.4" fill="#000000" opacity="0.14"/>
  <rect x="100" y="104" width="824" height="824" rx="185.4" ry="185.4" fill="#000000" opacity="0.22"/>

  <!-- Group clipped to official Apple Squircle (100% transparent outside) -->
  <g clip-path="url(#appleSquircle)">
    <!-- 1. Outer Aluminium Bezel -->
    <rect x="100" y="100" width="824" height="824" fill="url(#silverBezelGrad)"/>
    <!-- Aluminium Bezel Highlight Stroke -->
    <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4" fill="none" stroke="url(#bezelHighlight)" stroke-width="2"/>

    <!-- 2. Dark Recessed Inner Groove / Gap -->
    <rect x="136" y="132" width="752" height="748" rx="150" ry="150" fill="url(#grooveGrad)"/>
    <rect x="136" y="132" width="752" height="748" rx="150" ry="150" fill="none" stroke="#040506" stroke-width="2"/>

    <!-- 3. Inner Dark Matte Terminal Screen -->
    <rect x="154" y="146" width="716" height="710" rx="134" ry="134" fill="url(#screenSurfaceGrad)"/>
    <rect x="154" y="146" width="716" height="710" rx="134" ry="134" fill="none" stroke="url(#screenRimGrad)" stroke-width="2"/>

    <!-- 4. Subtle Diagonal Screen Specular Glint -->
    <path d="M 154 220 L 870 500 L 870 146 L 220 146 Z" fill="url(#specularGlint)"/>

    <!-- 5. Apple Terminal Identifier: Compact Sleek >_ (Model Standard, Centered at X=512) -->
    <path d="M 399 290 L 494 351 L 399 412 L 399 400 L 474 351 L 399 302 Z" fill="#ffffff"/>
    <rect x="515" y="438" width="110" height="14" rx="3" ry="3" fill="#e5e7eb"/>

    <!-- 6. Brand Writing with Oh My Zsh Green Prompt Arrow (Centered at X=512) -->
    <g>
      <!-- Oh My Zsh Green Prompt Arrow -->
      <path d="M 258 596 L 292 616 L 258 636 Z" fill="#30d158" stroke="#30d158" stroke-width="2" stroke-linejoin="round"/>

      <!-- Command Text 'devopsherocli' (SF Mono / Menlo regular typography, font-size 58) -->
      <text x="312" y="635" font-family="Menlo, Monaco, 'SF Mono', monospace" font-size="58" font-weight="400" fill="#00f2fe">devops</text>
      <text x="521" y="635" font-family="Menlo, Monaco, 'SF Mono', monospace" font-size="58" font-weight="400" fill="#30d158">hero</text>
      <text x="660" y="635" font-family="Menlo, Monaco, 'SF Mono', monospace" font-size="58" font-weight="400" fill="#f3f4f6">cli</text>
    </g>
  </g>
</svg>

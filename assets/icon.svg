<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Official Apple macOS Continuous Curvature Squircle Path (Big Sur / Monterey / Sonoma / Sequoia HIG) -->
    <clipPath id="appleSquircle">
      <path d="M 923.35,288.08 C 932.21,187.86 847.66,103.45 735.39,100 L 287.96,100 C 182.88,98.66 98.68,182.95 100,288.08 L 100,735.81 C 100.6,842.49 184.89,927.06 287.96,923.9 L 735.39,923.9 C 840.94,926.06 925.28,841.91 923.35,735.81 Z"/>
    </clipPath>

    <!-- Titanium Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d53"/>
      <stop offset="25%" stop-color="#2a2c30"/>
      <stop offset="50%" stop-color="#181a1d"/>
      <stop offset="75%" stop-color="#2a2c30"/>
      <stop offset="100%" stop-color="#3a3d42"/>
    </linearGradient>

    <!-- Metallic Rim Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e9297"/>
      <stop offset="50%" stop-color="#32353a"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>

    <!-- Screen Glass Deep Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Glass Specular Reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Group clipped to standard Apple Squircle -->
  <g clip-path="url(#appleSquircle)">
    <!-- Titanium Outer Bezel -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bezelGrad)"/>

    <!-- Inner Metallic Rim -->
    <path d="M 923.35,288.08 C 932.21,187.86 847.66,103.45 735.39,100 L 287.96,100 C 182.88,98.66 98.68,182.95 100,288.08 L 100,735.81 C 100.6,842.49 184.89,927.06 287.96,923.9 L 735.39,923.9 C 840.94,926.06 925.28,841.91 923.35,735.81 Z" fill="none" stroke="url(#rimStroke)" stroke-width="8"/>

    <!-- Terminal Screen Window -->
    <rect x="124" y="124" width="776" height="776" rx="140" fill="url(#screenGrad)" stroke="#2d333b" stroke-width="3"/>

    <!-- Title Bar Divider -->
    <line x1="124" y1="260" x2="900" y2="260" stroke="#21262d" stroke-width="3"/>

    <!-- macOS Window Traffic Light Controls -->
    <!-- Red Close -->
    <circle cx="204" cy="194" r="20" fill="#ff5f56" stroke="#e0443e" stroke-width="2"/>
    <circle cx="199" cy="189" r="6" fill="#ffffff" opacity="0.45"/>
    <!-- Yellow Minimize -->
    <circle cx="268" cy="194" r="20" fill="#ffbd2e" stroke="#dea123" stroke-width="2"/>
    <circle cx="263" cy="189" r="6" fill="#ffffff" opacity="0.45"/>
    <!-- Green Expand -->
    <circle cx="332" cy="194" r="20" fill="#27c93f" stroke="#1aab29" stroke-width="2"/>
    <circle cx="327" cy="189" r="6" fill="#ffffff" opacity="0.45"/>

    <!-- Window Header Tab -->
    <rect x="396" y="160" width="310" height="68" rx="14" fill="#1b1f26" stroke="#30363d" stroke-width="2"/>
    <text x="551" y="204" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="24" font-weight="600" fill="#8b949e" text-anchor="middle">zsh · devops</text>

    <!-- Terminal Display Content -->
    <g filter="url(#neonGlow)">
      <!-- Oh My Zsh Arrow -->
      <path d="M 188 566 L 228 590 L 188 614 Z" fill="#30d158"/>
      <!-- Terminal Text 'devopsherocli' -->
      <text x="260" y="614" font-family="'JetBrains Mono', 'Fira Code', 'Menlo', monospace" font-size="72" font-weight="700" letter-spacing="-1">
        <tspan fill="#00f2fe">devops</tspan><tspan fill="#30d158">hero</tspan><tspan fill="#ffffff">cli</tspan>
      </text>
      <!-- Block Cursor -->
      <rect x="830" y="550" width="34" height="74" rx="4" ry="4" fill="#00f2fe" opacity="0.9"/>
    </g>

    <!-- Diagonal Glass Specular Highlight -->
    <path d="M 100 240 L 924 560 L 924 100 L 240 100 Z" fill="url(#glassReflect)"/>
  </g>
</svg>
